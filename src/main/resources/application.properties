# ============================================
# RESTCONF AI Application Configuration
# ============================================

# Server Configuration
server.port=8080
spring.application.name=restconf-ai

# ============================================
# RESTCONF Configuration
# ============================================

# Mode: "simulator" or "real"
restconf.mode=simulator

# Real RESTCONF device base URL (used when mode=real)
restconf.base-url=https://localhost:8443/restconf

# RESTCONF credentials (use environment variables in production)
restconf.username=${RESTCONF_USERNAME:admin}
restconf.password=${RESTCONF_PASSWORD:admin}

# Connection settings
restconf.connection-timeout=5000
restconf.read-timeout=10000

# SSL verification (disable for self-signed certs in lab)
restconf.ssl-verify=false

# ============================================
# AI Configuration
# ============================================

# AI Provider: "gemini", "openai", "huggingface", "none"
ai.provider=${AI_PROVIDER:gemini}

# Google Gemini API
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-1.5-flash
ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# OpenAI API
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-3.5-turbo
ai.openai.api-url=https://api.openai.com/v1/chat/completions

# Hugging Face API
ai.huggingface.api-key=${HUGGINGFACE_API_KEY:}
ai.huggingface.model=Qwen/Qwen2.5-Coder-32B-Instruct
ai.huggingface.api-url=https://router.huggingface.co/v1/chat/completions

# AI request settings
ai.request-timeout=60000
ai.max-tokens=2048

# ============================================
# Simulator Configuration
# ============================================

# Simulated RESTCONF server port (internal)
simulator.enabled=true
simulator.data-file=classpath:data/simulator-data.json

# ============================================
# Logging Configuration
# ============================================

logging.level.root=INFO
logging.level.com.example.restconfai=DEBUG
logging.level.com.example.restconfai.restconf=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Prevent sensitive data in logs
logging.level.org.apache.http.wire=WARN
